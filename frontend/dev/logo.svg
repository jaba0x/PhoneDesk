<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PhoneDesk logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262e3b"/>
      <stop offset="1" stop-color="#1e2530"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .up   { fill: #4cc38a; animation: blink 2.4s ease-in-out infinite; }
    .off  { fill: #3a4354; }
    .warn { fill: #e8b04a; animation: warn 1.6s ease-in-out infinite; }
    .wake { animation: wake 6s steps(1) infinite; }
    .ring { fill: none; stroke: #4cc38a; stroke-width: 6; stroke-linecap: round; animation: ring 2.4s ease-out infinite; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.1s }
    .d4 { animation-delay: 1.5s } .d5 { animation-delay: 1.9s }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes warn  { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    @keyframes wake  { 0% { fill: #3a4354 } 45% { fill: #4cc38a } 85% { fill: #3a4354 } }
    @keyframes ring  { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 0 } }
  </style>

  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>

  <!-- faceplate -->
  <rect x="33" y="50" width="190" height="156" rx="14" fill="#181c24" stroke="#2d3544" stroke-width="2"/>

  <!-- handset in its cradle -->
  <rect x="46" y="64" width="26" height="128" rx="13" fill="#323b4b" stroke="#3f4a5c" stroke-width="2"/>
  <rect x="49" y="67" width="20" height="30" rx="10" fill="#3a4354"/>
  <rect x="49" y="159" width="20" height="30" rx="10" fill="#3a4354"/>

  <!-- display -->
  <rect x="86" y="64" width="92" height="54" rx="6" fill="#0f1218" stroke="#2d3544" stroke-width="2"/>
  <rect x="94" y="74" width="46" height="6" rx="3" fill="#3a4354"/>
  <rect x="94" y="88" width="62" height="6" rx="3" fill="#3a4354"/>
  <rect x="94" y="102" width="34" height="6" rx="3" fill="#3a4354"/>
  <circle class="up" cx="166" cy="77" r="4"/>

  <!-- line keys -->
  <rect class="up" x="190" y="66" width="22" height="14" rx="4"/>
  <rect class="up d2" x="190" y="86" width="22" height="14" rx="4"/>
  <rect class="warn" x="190" y="106" width="22" height="14" rx="4" filter="url(#glow)"/>

  <!-- keypad -->
  <g fill="#3a4354">
    <circle cx="106" cy="138" r="6"/><circle cx="132" cy="138" r="6"/><circle cx="158" cy="138" r="6"/>
    <circle cx="106" cy="156" r="6"/><circle cx="132" cy="156" r="6"/><circle cx="158" cy="156" r="6"/>
    <circle cx="106" cy="174" r="6"/><circle cx="132" cy="174" r="6"/><circle cx="158" cy="174" r="6"/>
    <circle cx="106" cy="192" r="6"/><circle cx="132" cy="192" r="6"/><circle cx="158" cy="192" r="6"/>
  </g>
  <!-- soft keys -->
  <rect x="190" y="138" width="22" height="8" rx="4" fill="#3a4354"/>
  <rect x="190" y="152" width="22" height="8" rx="4" fill="#3a4354"/>
  <rect x="190" y="166" width="22" height="8" rx="4" fill="#3a4354"/>
</svg>
